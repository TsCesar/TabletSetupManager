# Compila y verifica Tablet Setup Installer y Tablet Updater en la nube, sin Android Studio.
#
# Resultado de cada ejecución:
#   - Artefacto «TabletSetupManager-APK» (APK + informes) en la pestaña Actions.
#   - Rama «apk-builds» con la última compilación de main (APK, SHA256SUMS e informes).
#
# Catálogo empresarial por defecto (opcional): variables del repositorio TSM_CATALOG_URL y
# TSM_CATALOG_PUBLIC_KEY (Settings → Secrets and variables → Actions → Variables).
# Firma release (opcional): secretos TSM_RELEASE_KEYSTORE_BASE64, TSM_RELEASE_KEYSTORE_PASSWORD,
# TSM_RELEASE_KEY_ALIAS y TSM_RELEASE_KEY_PASSWORD. Sin ellos solo se generan APK debug.
name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      CATALOG_ARGS: -Ptsm.catalog.url=${{ vars.TSM_CATALOG_URL }} -Ptsm.catalog.publicKey=${{ vars.TSM_CATALOG_PUBLIC_KEY }}
      HAS_RELEASE_KEY: ${{ secrets.TSM_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (línea de comandos)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Gradle (wrapper validado + caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Versiones de herramientas
        run: |
          ./gradlew --version
          ls "$ANDROID_HOME/build-tools"

      - name: Compilar APK debug
        id: assemble
        continue-on-error: true
        run: |
          mkdir -p dist/logs
          set -o pipefail
          ./gradlew --stacktrace $CATALOG_ARGS collectDebugApks 2>&1 | tee dist/logs/01-compilar-debug.log

      - name: Verificar APK (aapt2 + apksigner + contenido)
        id: verify
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          set -o pipefail
          python3 tools/verify_apks.py --installer dist/TabletSetupInstaller-debug.apk \
            --updater dist/TabletUpdater-debug.apk --report dist/VERIFICACION_APK.md 2>&1 | tee dist/logs/02-verificacion.log
          aapt2 dump badging dist/TabletSetupInstaller-debug.apk > dist/badging-installer.txt
          aapt2 dump badging dist/TabletUpdater-debug.apk > dist/badging-updater.txt
          apksigner verify --print-certs -v dist/TabletSetupInstaller-debug.apk > dist/firma-installer.txt
          apksigner verify --print-certs -v dist/TabletUpdater-debug.apk > dist/firma-updater.txt

      - name: Pruebas unitarias (núcleo JVM + Robolectric)
        id: tests
        continue-on-error: true
        run: |
          mkdir -p dist/logs
          set -o pipefail
          ./gradlew --stacktrace :core:testDebugUnitTest :updater:testDebugUnitTest 2>&1 | tee dist/logs/03-pruebas.log

      - name: Lint (manifiestos, recursos y API)
        id: lint
        continue-on-error: true
        run: |
          mkdir -p dist/logs
          set -o pipefail
          ./gradlew --stacktrace lintDebug 2>&1 | tee dist/logs/04-lint.log

      - name: Compilación release minificada (R8) sin firmar
        id: release_check
        if: env.HAS_RELEASE_KEY != 'true'
        continue-on-error: true
        run: |
          mkdir -p dist/logs
          set -o pipefail
          ./gradlew --stacktrace $CATALOG_ARGS assembleRelease 2>&1 | tee dist/logs/05-release-r8.log

      - name: Compilación release firmada
        id: release_signed
        if: env.HAS_RELEASE_KEY == 'true'
        continue-on-error: true
        env:
          TSM_RELEASE_KEYSTORE_BASE64: ${{ secrets.TSM_RELEASE_KEYSTORE_BASE64 }}
          TSM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TSM_RELEASE_KEYSTORE_PASSWORD }}
          TSM_RELEASE_KEY_ALIAS: ${{ secrets.TSM_RELEASE_KEY_ALIAS }}
          TSM_RELEASE_KEY_PASSWORD: ${{ secrets.TSM_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$TSM_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export TSM_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          ./gradlew --stacktrace $CATALOG_ARGS collectReleaseApks
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Reunir informes
        if: always()
        run: |
          mkdir -p dist/informes
          for m in core updater installer; do
            [ -d "$m/build/test-results" ] && cp -r "$m/build/test-results" "dist/informes/$m-test-results" || true
            [ -d "$m/build/reports/tests" ] && cp -r "$m/build/reports/tests" "dist/informes/$m-tests-html" || true
            for f in "$m"/build/reports/lint-results-*.{html,xml,txt}; do [ -f "$f" ] && cp "$f" "dist/informes/$m-$(basename "$f")"; done
          done
          (cd dist && ls *.apk >/dev/null 2>&1 && sha256sum *.apk > SHA256SUMS.txt || true)
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "assemble=${{ steps.assemble.outcome }}"
            echo "verify=${{ steps.verify.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "release_unsigned=${{ steps.release_check.outcome }}"
            echo "release_signed=${{ steps.release_signed.outcome }}"
          } > dist/RESULTADOS.txt
          cat dist/RESULTADOS.txt

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TabletSetupManager-APK
          path: dist/
          if-no-files-found: warn

      - name: Publicar en la rama apk-builds
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/pub" && cp -r dist "$RUNNER_TEMP/pub"
          cd "$RUNNER_TEMP/pub"
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "APK y verificaciones de ${GITHUB_SHA::7} (ejecución ${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds

      - name: Resultado final
        if: always()
        run: |
          failed=0
          for s in "${{ steps.assemble.outcome }}" "${{ steps.verify.outcome }}" "${{ steps.tests.outcome }}" "${{ steps.lint.outcome }}"; do
            [ "$s" = "success" ] || failed=1
          done
          for s in "${{ steps.release_check.outcome }}" "${{ steps.release_signed.outcome }}"; do
            [ "$s" = "failure" ] && failed=1
          done
          exit $failed
