# Sondeo puntual de fuentes oficiales (solo en la rama sondeo-fuentes; no publica nada).
name: Sondear fuentes
on:
  push:
    branches: [sondeo-fuentes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"
      - name: Descarga oficial de WhatsApp (variantes)
        run: |
          mkdir -p out
          probe() {  # $1 etiqueta, resto: argumentos de curl
            label=$1; shift
            code=$(curl -sS -L -o out/p.html -D out/p.h -w '%{http_code} %{size_download} %{url_effective}' "$@" || echo "curl-error")
            links=$(grep -oE 'https://scontent[^"'"'"' <>]*\.apk' out/p.html | sort -u | head -1)
            ver=$(grep -oE 'Version [0-9][0-9.]*' out/p.html | head -1)
            echo "[$label] $code · enlace: ${links:-NINGUNO} · ${ver:-sin versión}"
          }
          CH='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          AN='Mozilla/5.0 (Linux; Android 14; SM-X710) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          probe "curl por defecto" https://www.whatsapp.com/android/
          probe "Chrome escritorio" -A "$CH" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: es-ES,es;q=0.9' https://www.whatsapp.com/android/
          probe "Chrome Android" -A "$AN" -H 'Accept: text/html' -H 'Accept-Language: es-ES,es;q=0.9' https://www.whatsapp.com/android/
          probe "Okhttp-like" -A "Dalvik/2.1.0 (Linux; U; Android 14; SM-X710 Build/UP1A)" https://www.whatsapp.com/android/
          probe "download/android" -A "$AN" https://www.whatsapp.com/download/android
          probe "sin barra" -A "$AN" https://www.whatsapp.com/android
          echo "### Contenido de la respuesta bloqueada (primeros 1500 caracteres, sin scripts)"
          curl -sS -L -A "$CH" https://www.whatsapp.com/android/ | sed -E 's/<script[^>]*>[^<]*<\/script>//g' | head -c 1500; echo
          echo "### Cabeceras"
          curl -sS -I -A "$CH" https://www.whatsapp.com/android/ | head -20
          echo "### CDN sin firma"
          curl -sS -o /dev/null -w '%{http_code} %{size_download}\n' https://scontent.whatsapp.net/v/t61.25591-34/10000000_2555604091620975_4821946127231201755_n.apk/WhatsApp.apk
          echo "### IP pública del ejecutor"
          curl -sS https://api.github.com/meta -o /dev/null -w '%{http_code}\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sondeo-whatsapp
          path: out/
  google-play:
    if: ${{ !contains(github.event.head_commit.message, '[solo-whatsapp]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_c
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/probe_gms_image.sh out-gms-${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sondeo-google-play-api${{ matrix.api-level }}
          path: out-gms-${{ matrix.api-level }}/
