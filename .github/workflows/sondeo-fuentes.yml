# Sondeo puntual de fuentes oficiales (solo en la rama sondeo-fuentes; no publica nada).
name: Sondear fuentes
on:
  push:
    branches: [sondeo-fuentes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"
      - name: Descarga oficial de WhatsApp (APK real)
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          mkdir -p out
          for UA in "TabletSetupManager/0.3.0 (Android)" "Dalvik/2.1.0 (Linux; U; Android 14; SM-X710 Build/UP1A)"; do
            code=$(curl -sS -L -A "$UA" -o out/page.html -w '%{http_code} %{url_effective} %{size_download}' https://www.whatsapp.com/android/)
            echo "UA [$UA] -> $code · enlaces: $(grep -oE 'https://scontent[^"'"'"' <>]*\.apk/WhatsApp\.apk' out/page.html | sort -u | wc -l) · $(grep -oE 'Version [0-9][0-9.]*' out/page.html | head -1)"
          done
          grep -oE 'href="https://scontent[^"]*"' out/page.html | head -3 | sed -E 's/(oh|oe)=[^&"]*/\1=…/g'
          link=$(grep -oE 'href="https://scontent[^"]*WhatsApp\.apk[^"]*"' out/page.html | head -1 | sed -E 's/^href="//; s/"$//; s/&amp;/\&/g')
          echo "Parámetros del enlace: $(echo "$link" | sed -E 's/^[^?]*\?//; s/=[^&]*/=…/g')"
          code=$(curl -sS -L -A "TabletSetupManager/0.3.0 (Android)" -D out/apk.h -o out/WhatsApp.apk -w '%{http_code} %{size_download}' "$link")
          echo "Descarga APK: $code"
          grep -iE '^(HTTP|content-type|content-length|etag|last-modified|cache-control|accept-ranges)' out/apk.h
          echo "HEAD:"; curl -sS -I -A "TabletSetupManager/0.3.0 (Android)" "$link" | grep -iE '^(HTTP|content-length|etag|last-modified|accept-ranges)'
          echo "Rango 0-0:"; curl -sS -r 0-0 -o /dev/null -D - -A "TabletSetupManager/0.3.0 (Android)" "$link" | grep -iE '^(HTTP|content-range|etag|last-modified)'
          echo "### APK"
          file out/WhatsApp.apk; sha256sum out/WhatsApp.apk
          aapt2 dump badging out/WhatsApp.apk 2>/dev/null | grep -E "^package|sdkVersion|targetSdkVersion|native-code|^application-label:|supports-screens|uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" 
          apksigner verify --print-certs -v out/WhatsApp.apk 2>&1 | grep -E "Verified using|Signer #1 certificate (DN|SHA-256|SHA-1)|Number of signers|WARNING" | head -12
          unzip -l out/WhatsApp.apk | grep -oE 'lib/[^/]+/' | sort | uniq -c
          echo "### Segunda lectura: ¿cambia el enlace firmado?"
          sleep 3
          curl -sS -L -A "TabletSetupManager/0.3.0 (Android)" https://www.whatsapp.com/android/ | grep -oE 'https://scontent[^"'"'"' <>]*\.apk/WhatsApp\.apk[^"'"'"' <>]*' | head -1 | sed -E 's/(oh|oe|_nc_gid|_nc_ohc|_nc_zt|ccb)=[^&]*/\1=…/g'
          rm -f out/WhatsApp.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sondeo-whatsapp
          path: out/
  google-play:
    if: ${{ !contains(github.event.head_commit.message, '[solo-whatsapp]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_c
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/probe_gms_image.sh out-gms-${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sondeo-google-play-api${{ matrix.api-level }}
          path: out-gms-${{ matrix.api-level }}/
