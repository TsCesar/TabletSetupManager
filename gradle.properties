org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Configuración de Tablet Setup Manager (se puede sobrescribir con -P o con
# variables de entorno ORG_GRADLE_PROJECT_<nombre> en CI).
# ---------------------------------------------------------------------------
# Versión de ambas aplicaciones.
tsm.versionName=0.3.0
tsm.versionCode=3
# Catálogo empresarial firmado. Ambos valores vacíos = sin catálogo por defecto
# (se puede configurar en cada tablet desde la aplicación).
#   tsm.catalog.url       URL HTTPS del catalog.json (la firma se busca en <url>.sig)
#   tsm.catalog.publicKey Clave pública ECDSA P-256 (X.509/SPKI en Base64) que firma el catálogo
tsm.catalog.url=
tsm.catalog.publicKey=
